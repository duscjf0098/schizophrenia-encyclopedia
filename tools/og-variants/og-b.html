<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  /* 시안 B "어두운 표지" · 1200×630. 어두운 바탕, 아주 큰 명조 제목, 보라 조현 곡선이 주인공. */
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #15171c; color: #e7e9ec; font-family: "Pretendard Variable", Pretendard, sans-serif; position: relative; }
  .glow { position: absolute; left: 150px; top: 220px; width: 900px; height: 360px; background: radial-gradient(closest-side, rgba(122,114,230,.22), rgba(122,114,230,0)); }
  .strings { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; }
  .box { position: absolute; left: 60px; top: 64px; width: 1080px; }
  .mark { display: flex; align-items: center; gap: 14px; color: #9097a2; font-size: 25px; font-weight: 600; letter-spacing: -0.01em; }
  .mark svg { width: 40px; height: 40px; }
  h1 { font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 164px; letter-spacing: -0.04em; line-height: 1; margin: 24px 0 0; color: #f2f3f5; white-space: nowrap; }
  .trust { position: absolute; left: 60px; right: 60px; bottom: 66px; display: flex; align-items: baseline; justify-content: space-between; }
  .trust .big { font-size: 34px; font-weight: 600; color: #e7e9ec; letter-spacing: -0.01em; }
  .trust .big b { font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 44px; color: #c6c2fa; font-variant-numeric: tabular-nums; margin: 0 2px; }
  .trust .sub { font-size: 22px; color: #9097a2; }
  .trust .sub b { color: #c5cad1; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <svg class="strings" viewBox="0 0 1200 630" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#8d87f0"/><stop offset=".5" stop-color="#c6c2fa"/><stop offset="1" stop-color="#8d87f0"/></linearGradient>
      <filter id="f" x="-10%" y="-80%" width="120%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    </defs>
    <g stroke="#2a2e36" stroke-width="2">
      <path d="M0 340H1200"/><path d="M0 366H1200"/><path d="M0 418H1200"/><path d="M0 444H1200"/>
    </g>
    <path d="M0 392 C 200 392, 300 470, 420 470 S 600 392, 760 392 L 1200 392" stroke="#7c75e6" stroke-width="18" fill="none" opacity=".45" filter="url(#f)"/>
    <path d="M0 392 C 200 392, 300 470, 420 470 S 600 392, 760 392 L 1200 392" stroke="url(#g)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="420" cy="470" r="20" fill="#7c75e6" opacity=".35"/>
    <circle cx="420" cy="470" r="11" fill="#c6c2fa"/>
  </svg>
  <div class="box">
    <div class="mark">
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none">
          <path d="M3 6h22"/><path d="M3 10.5h22"/><path d="M3 15c6 0 8 2.6 11 2.6S19 15 25 15" stroke="#aaa5f6"/><path d="M3 19.5h22"/><path d="M3 24h22"/>
        </g>
        <circle cx="14" cy="17.6" r="1.9" fill="#aaa5f6"/>
      </svg>
      출처와 함께 읽는 한국어 백과
    </div>
    <h1>조현병 백과</h1>
  </div>
  <div class="trust">
    <span class="big">출처 <b>944</b>개와 함께 읽어요</span>
    <span class="sub">문서 <b>251</b> · 용어 <b>205</b></span>
  </div>
</body>
</html>
