<script>
/* 옛 해시 주소(#/a/…)로 들어오면 새 경로로 옮기고, 첫 그리기 전에 테마·글자 크기를 적용한다 */
(function () {
  var h = location.hash;
  if (h.indexOf('#/') === 0) {
    var rest = h.slice(2), qi = rest.indexOf('?');
    var p = (qi >= 0 ? rest.slice(0, qi) : rest).split('/').filter(Boolean).join('/');
    location.replace(document.documentElement.getAttribute('data-base') + (p ? p + '/' : '') + (qi >= 0 ? rest.slice(qi) : ''));
  }
  try {
    var t = JSON.parse(localStorage.getItem('jhb.theme') || 'null');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    var f = JSON.parse(localStorage.getItem('jhb.fs') || 'null');
    if (f === 's' || f === 'l') document.documentElement.setAttribute('data-fs', f);
  } catch (e) { }
})();
</script>
